workflows:
  ai-studio-to-apk:
    name: Compilar APK desde AI Studio
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "https://stitch.withgoogle.com/projects/17305166620186457298"
        APP_NAME: "MSmart Personal Finance Hub"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Instalar dependencias del proyecto
        script: | 
          npm install
      - name: Generar la versión de producción (Build)
        script: |
          npm run build --if-present
      - name: Configurar e instalar Capacitor
        script: |
          npm install @capacitor/core @capacitor/cli
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir=dist
          npx cap add android
      - name: Sincronizar código con Android
        script: |
          npx cap sync android
      - name: Compilar APK de Android (Modo Debug)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

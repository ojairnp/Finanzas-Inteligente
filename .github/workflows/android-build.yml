name: Build Android APK from AI Studio
on:
  push:
    branches: [ main ] # Cambia a master si tu rama principal se llama así

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Find Project Directory
      id: find-dir
      run: |
        # Busca dónde está el archivo package.json en el repositorio
        PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
        if [ -z "$PKG_PATH" ]; then
          echo "ERROR: No se encontró package.json en ningún lado."
          exit 1
        fi
        # Extrae la ruta de la carpeta
        SUB_DIR=$(dirname "$PKG_PATH" | sed 's|^\./||')
        if [ "$SUB_DIR" = "." ]; then SUB_DIR=""; fi
        echo "SUB_DIR=$SUB_DIR" >> $GITHUB_ENV
        echo "Proyecto encontrado en la carpeta: /$SUB_DIR"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        if [ -n "$SUB_DIR" ]; then cd "$SUB_DIR"; fi
        npm install

    - name: Build Web App
      run: |
        if [ -n "$SUB_DIR" ]; then cd "$SUB_DIR"; fi
        npm run build --if-present

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure and Sync Capacitor
      run: |
        if [ -n "$SUB_DIR" ]; then cd "$SUB_DIR"; fi
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # Determina si la carpeta de salida es dist o build
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        
        npx cap init "FinanzasInteligentes" "com.finanzas.inteligentes" --web-dir=$WEB_DIR --skip-appid-validation
        npx cap add android
        npx cap sync android

    - name: Build APK (Debug Mode)
      run: |
        if [ -n "$SUB_DIR" ]; then cd "$SUB_DIR"; fi
        cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/android/app/build/outputs/apk/debug/app-debug.apk

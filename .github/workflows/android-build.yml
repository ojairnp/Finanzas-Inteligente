name: Build Android APK from AI Studio
on:
  push:
    branches: [ main ] # Cambia a master si tu rama principal se llama así

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Web App (Vite/React)
      run: npm run build --if-present

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Configure and Sync Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "MiAppStitch" "com.mystitchapp.project" --web-dir=dist --skip-appid-validation
        npx cap add android
        npx cap sync android

    - name: Build APK (Debug Mode)
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK Artifact (Updated v4)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

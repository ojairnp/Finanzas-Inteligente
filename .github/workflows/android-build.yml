name: Build Android APK (Static Web App)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Debug - List Files
      run: find . -maxdepth 3 -not -path '*/.git/*' | sort

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Create Web Dist Directory
      run: |
        # Copia todos los archivos web a una carpeta "dist"
        mkdir -p dist
        # Copia todo excepto .git y node_modules
        find . -maxdepth 1 \
          -not -name '.' \
          -not -name '.git' \
          -not -name 'node_modules' \
          -not -name 'dist' \
          -not -name 'package.json' \
          -not -name 'package-lock.json' \
          | while read item; do
            cp -r "$item" dist/
          done

    - name: Initialize Capacitor and Sync
      run: |
        npx cap init "FinanzasInteligentes" "com.finanzas.inteligentes" --web-dir=dist
        npx cap add android
        npx cap sync android

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
